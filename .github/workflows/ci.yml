name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned, not ubuntu-latest: when latest moved to 26.04, Playwright 1.57 could
# no longer install Chromium there, and a runner change should not fail CI.
jobs:
  check:
    name: lint · typecheck · test · audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Integration tests start their own Postgres through Testcontainers;
      # the hosted runner provides Docker.
      - run: npm test
      - run: npm audit --audit-level=high

  compose:
    name: docker compose up · smoke · e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # Exactly what a reviewer runs: no .env, no extra flags.
      - run: docker compose up --build -d
      - name: Wait for the app to report healthy
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Migrations and seed finished cleanly
        run: test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = "0"
      - name: The login page renders in Arabic
        run: curl -fsS http://localhost:3000/login | grep -q 'lang="ar" dir="rtl"'
      - name: Smoke test over HTTP (login, roles, cookie flags, logout)
        run: bash scripts/smoke.sh
      # The sale end to end in a real browser: reserve, draft, approve, pay.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Logs
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
